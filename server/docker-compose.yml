# Local stack: PostgreSQL and the API. `docker compose up --build`, then open http://localhost:8080/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://planner:planner@db:5432/planner
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
    ports: ["8080:8080"]
    volumes: [media:/data/media]

volumes:
  db-data:
  media:
