version: 2
updates:
  - package-ecosystem: gradle
    directories: ["/android", "/android/core"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases settle before adopting them
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, android]
    groups:
      androidx:
        patterns: ["androidx.*", "com.android.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases settle before adopting them
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, server]
    groups:
      server:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases settle before adopting them
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, server]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases settle before adopting them
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, web]
    groups:
      web:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases settle before adopting them
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
