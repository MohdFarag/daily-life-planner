name: Feature or requirement
description: Propose a feature or track a PRD requirement
labels: [enhancement]
body:
  - type: input
    id: prd
    attributes:
      label: PRD requirement IDs
      placeholder: e.g. CAL01, NOT01
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2, POC]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable results, in the style of the PRD's AC table.
