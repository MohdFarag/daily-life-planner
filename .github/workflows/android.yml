name: Android

on:
  push:
    branches: [main, "feature/**"]
    paths: ["android/**", ".github/workflows/android.yml", ".github/scripts/**", ".github/problem-matchers/**"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml", ".github/scripts/**", ".github/problem-matchers/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android
    shell: bash

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write # test report annotations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: echo "::add-matcher::${GITHUB_WORKSPACE}/.github/problem-matchers/kotlin.json"

      - name: Test
        run: set -o pipefail; ./gradlew -p core test --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Explain failure
        if: failure()
        run: ../.github/scripts/gradle-failure-annotations.sh "$RUNNER_TEMP/gradle.log"
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: android/core/build/test-results/test/*.xml
          check_name: Core test results

  app:
    name: App build, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: echo "::add-matcher::${GITHUB_WORKSPACE}/.github/problem-matchers/kotlin.json"

      - name: Unit tests, lint and debug build
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Explain failure
        if: failure()
        run: ../.github/scripts/gradle-failure-annotations.sh "$RUNNER_TEMP/gradle.log"
      - name: Lint warnings
        if: always()
        run: ../.github/scripts/lint-warning-summary.sh "$RUNNER_TEMP/gradle.log"
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: android/app/build/test-results/**/*.xml
          check_name: App test results

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-life-planner-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
